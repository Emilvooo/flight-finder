* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative;
  background: #090C11;
  color: #ECEFF3;
  font-family: 'Archivo', system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
svg.map { position: absolute; inset: 0; }
.land { fill: #121823; stroke: #2B3546; stroke-width: 1; stroke-linejoin: round; }
.ap { fill: #4A5463; }
.route { fill: none; stroke: #5E9EEA; stroke-width: 2.25; stroke-linecap: round; opacity: 0.9; }

.origin { fill: #FFFFFF; stroke: #090C11; stroke-width: 3; }
.origin.best { fill: #FFD100; }
.code { font-stretch: 78%; font-weight: 800; font-size: 21px; fill: #FFFFFF; paint-order: stroke; stroke: #090C11; stroke-width: 6px; stroke-linejoin: round; }
.code.best { fill: #FFD100; }

.copy { position: absolute; left: 72px; top: 64px; }
.brand { display: flex; align-items: center; gap: 16px; color: #FFD100; font-stretch: 72%; font-weight: 850; font-size: 46px; line-height: 1; letter-spacing: -0.005em; }
.mark { display: grid; place-items: center; width: 56px; height: 56px; background: #0E4C92; border-radius: 9px; box-shadow: inset 0 0 0 4px #0E4C92, inset 0 0 0 6px #fff; }
.mark svg { width: 30px; height: 30px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
h1 { margin-top: 70px; font-stretch: 72%; font-weight: 850; font-size: 86px; line-height: 0.94; letter-spacing: -0.01em; white-space: nowrap; }
.sub { margin-top: 26px; width: 470px; font-size: 24px; line-height: 1.38; color: #B7C0CC; }
.url { position: absolute; left: 72px; bottom: 48px; font-size: 20px; font-weight: 650; color: #8F99A8; letter-spacing: 0.01em; }
.stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: #FFD100; }

.dest {
  position: absolute; display: flex; align-items: center; gap: 9px;
  height: 50px; padding: 0 16px 0 13px;
  background: #0E4C92; color: #fff; border-radius: 9px;
  box-shadow: inset 0 0 0 3px #0E4C92, inset 0 0 0 5px #fff;
  font-stretch: 78%; font-weight: 850; font-size: 27px; line-height: 1;
  transform: translate(calc(-100% - 18px), -50%);
}
.dest svg { width: 24px; height: 24px; fill: #fff; }
.price {
  position: absolute; padding: 7px 13px 8px;
  background: #FFD100; color: #141A24; border-radius: 7px;
  box-shadow: 0 0 0 4px #090C11;
  font-stretch: 85%; font-weight: 850; font-size: 30px; line-height: 1;

</div>
<div class="url">flights.emilvooo.nl</div>

241,48.663],[19.134,48.638],[20.241,49.074],[24.686,48.884],[23.956,49.812],[25.981,48.259],[22.263,48.634],[23.898,52.108],[20.593,54.89]]
;
const ORIGINS = [
  { code: 'GRQ', lon: 6.579, lat: 53.120, dx: 13, dy: -8, anchor: 'start', bend: 30 },
  { code: 'AMS', lon: 4.764, lat: 52.309, dx: -14, dy: 7, anchor: 'end', bend: -95 },
  { code: 'FMO', lon: 7.685, lat: 52.135, dx: 14, dy: 7, anchor: 'start', bend: 85 },
  { code: 'DUS', lon: 6.767, lat: 51.289, dx: 14, dy: 12, anchor: 'start', bend: 55 },
  { code: 'EIN', lon: 5.375, lat: 51.450, dx: -14, dy: 14, anchor: 'end', bend: -40, best: true },
];
const BCN = [2.079, 41.297];
const TARGET = { bcn: [760, 555], grq: [1000, 88] };

const proj = d3.geoMercator().scale(1).translate([0, 0]);
const a = proj(BCN), b = proj([ORIGINS[0].lon, ORIGINS[0].lat]);
const k = (TARGET.grq[1] - TARGET.bcn[1]) / (b[1] - a[1]);
proj.scale(k);
const a2 = proj(BCN);
const cx = TARGET.bcn[0] - a2[0];
proj.translate([cx, TARGET.bcn[1] - a2[1]]);

const svg = d3.select('svg.map');
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json').then(r => r.json()).then(world => {
  const land = topojson.feature(world, world.objects.countries);
  svg.append('g').selectAll('path').data(land.features).join('path').attr('class', 'land').attr('d', d3.geoPath(proj));

  svg.append('g').selectAll('circle').data(AIRPORTS).join('circle')
    .attr('class', 'ap').attr('r', 2.2)
    .attr('cx', d => proj(d)[0]).attr('cy', d => proj(d)[1]);

  const end = proj(BCN);
  const curve = (o, bend) => {
    const s = proj([o.lon, o.lat]);
    const mx = (s[0] + end[0]) / 2, my = (s[1] + end[1]) / 2;
    const dx = end[0] - s[0], dy = end[1] - s[1], len = Math.hypot(dx, dy);
    const c = [mx + (dy / len) * bend, my - (dx / len) * bend];
    return { s, c, d: `M${s[0]},${s[1]} Q${c[0]},${c[1]} ${end[0]},${end[1]}` };
  };
  const routes = svg.append('g');
  const ordered = [...ORIGINS].sort((x, y) => (x.best ? 1 : 0) - (y.best ? 1 : 0));
  for (const o of ordered) {
    const r = curve(o, o.bend);
    routes.append('path').attr('class', 'route' + (o.best ? ' best' : '')).attr('d', r.d);
    if (o.best) {
      const t = 0.5, p = [(1-t)**2*r.s[0] + 2*(1-t)*t*r.c[0] + t*t*end[0], (1-t)**2*r.s[1] + 2*(1-t)*t*r.c[1] + t*t*end[1]];
      Object.assign(document.getElementById('price').style, { left: p[0] + 'px', top: p[1] + 'px' });
    }
  }
  for (const o of ORIGINS) {
    const p = proj([o.lon, o.lat]);
    svg.append('circle').attr('class', 'origin' + (o.best ? ' best' : '')).attr('r', 7).attr('cx', p[0]).attr('cy', p[1]);
    svg.append('text').attr('class', 'code' + (o.best ? ' best' : '')).attr('x', p[0] + o.dx).attr('y', p[1] + o.dy).attr('text-anchor', o.anchor).text(o.code);
  }
  svg.append('circle').attr('r', 7).attr('cx', end[0]).attr('cy', end[1]).attr('fill', '#fff').attr('stroke', '#0E4C92').attr('stroke-width', 3);
  Object.assign(document.getElementById('dest').style, { left: end[0] + 'px', top: end[1] + 'px' });
  document.body.dataset.ready = '1';
});
</script>
